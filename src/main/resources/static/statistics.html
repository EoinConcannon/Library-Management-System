<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>LibraryMS - Statistics</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
	<link href="/css/style.css" rel="stylesheet" />
</head>

<body>

	<nav class="navbar navbar-expand-lg sticky-top">
		<div class="container">
			<a class="navbar-brand" href="index.html">LibraryMS</a>
			<div class="ms-auto d-flex gap-2 align-items-center">
				<a href="catalogue.html" class="btn btn-outline-secondary btn-sm">Catalogue</a>
				<a href="my-books.html" class="btn btn-outline-secondary btn-sm">My Books</a>
				<a href="book-management.html" class="btn btn-outline-secondary btn-sm">Book Management</a>
				<a href="create-account.html" class="btn btn-outline-secondary btn-sm">Manage Users</a>
				<a href="statistics.html" class="btn btn-primary btn-sm">Statistics</a>
				<span id="navUsername" class="text-muted small d-none"></span>
				<a href="#" onclick="logout()" id="logoutBtn" class="btn btn-outline-danger btn-sm d-none">Logout</a>
			</div>
		</div>
	</nav>

	<div class="container py-5">
		<h2 class="fw-bold mb-1">Library Statistics</h2>
		<p class="text-muted mb-4">Borrowing trends, popular books and user activity.</p>

		<!-- Genre Filter -->
		<div class="row mb-4">
			<div class="col-md-4">
				<div class="d-flex gap-2 align-items-center">
					<label class="form-label mb-0 text-nowrap fw-semibold">Filter by Genre:</label>
					<select id="genreFilter" class="form-select form-select-sm" onchange="loadStatistics()">
						<option value="">All Genres</option>
						<option>Fiction</option>
						<option>Non-Fiction</option>
						<option>Science Fiction</option>
						<option>Fantasy</option>
						<option>Mystery</option>
						<option>History</option>
						<option>Biography</option>
						<option>Romance</option>
						<option>Horror</option>
						<option>Other</option>
					</select>
				</div>
			</div>
		</div>

		<!-- Summary Cards -->
		<div class="row g-3 mb-4">
			<div class="col-md-4">
				<div class="stat-card">
					<div class="stat-number" id="totalBooks">-</div>
					<div class="stat-label">Total Books</div>
				</div>
			</div>
			<div class="col-md-4">
				<div class="stat-card">
					<div class="stat-number" id="totalBorrowings">-</div>
					<div class="stat-label">Total Borrowings</div>
				</div>
			</div>
			<div class="col-md-4">
				<div class="stat-card">
					<div class="stat-number" id="activeUsers">-</div>
					<div class="stat-label">Active Users</div>
				</div>
			</div>
		</div>

		<!-- Charts Row 1 -->
		<div class="row g-3 mb-3">
			<div class="col-md-6">
				<div class="chart-card">
					<h6>Most Borrowed Books</h6>
					<div style="height: 300px;">
						<canvas id="mostBorrowedCanvas"></canvas>
					</div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="chart-card">
					<h6>Borrowings by Genre</h6>
					<div style="height: 300px;">
						<canvas id="genreCanvas"></canvas>
					</div>
				</div>
			</div>
		</div>

		<!-- Charts Row 2 -->
		<div class="row g-3">
			<div class="col-12">
				<div class="chart-card">
					<h6>Borrowing Trend</h6>
					<div style="height: 300px;">
						<canvas id="trendCanvas"></canvas>
					</div>
				</div>
			</div>
		</div>
	</div>

	<footer>LibraryMS - MASE 2026</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script>
		function getToken() {return localStorage.getItem('jwt_token') || '';}
		function authHeaders() {
			return {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken()};
		}
		function logout() {
			localStorage.removeItem('jwt_token');
			localStorage.removeItem('user_name');
			localStorage.removeItem('user_role');
			window.location.href = '/login.html';
		}

		let mostBorrowedChart, genreChart, trendChart;

		document.addEventListener('DOMContentLoaded', () => {
			const userName = localStorage.getItem('user_name');
			const userRole = localStorage.getItem('user_role');

			if (!userName) {window.location.href = '/login.html'; return;}
			if (userRole !== 'LIBRARIAN') {window.location.href = '/index.html'; return;}

			document.getElementById('navUsername').textContent = userName;
			document.getElementById('navUsername').classList.remove('d-none');
			document.getElementById('logoutBtn').classList.remove('d-none');

			loadStatistics();
		});

		async function loadStatistics() {
			const genre = document.getElementById('genreFilter').value;
			const url = genre ? `/api/statistics?genre=${encodeURIComponent(genre)}` : '/api/statistics';

			try {
				const res = await fetch(url, {headers: authHeaders()});
				const data = await res.json();
				renderStatistics(data);
			} catch (e) {
				console.error('Failed to load statistics', e);
			}
		}

		function renderStatistics(data) {
			// Summary cards
			document.getElementById('totalBooks').textContent = data.totalBooks;
			document.getElementById('totalBorrowings').textContent = data.totalBorrowings;
			document.getElementById('activeUsers').textContent = data.activeUsers;

			renderMostBorrowedChart(data.mostBorrowedBooks);
			renderGenreChart(data.borrowingsByGenre);
			renderTrendChart(data.borrowingsTrend);
		}

		function renderMostBorrowedChart(books) {
			if (mostBorrowedChart) {mostBorrowedChart.destroy();}

			const ctx = document.getElementById('mostBorrowedCanvas').getContext('2d');
			const labels = (books || []).map(b => b.title.length > 20 ? b.title.substring(0, 20) + '...' : b.title);
			const data = (books || []).map(b => b.count);

			mostBorrowedChart = new Chart(ctx, {
				type: 'bar',
				data: {
					labels: labels.length > 0 ? labels : ['No data'],
					datasets: [{
						label: 'Times Borrowed',
						data: data.length > 0 ? data : [0],
						backgroundColor: '#2e7d32',
						borderRadius: 4
					}]
				},
				options: {
					indexAxis: 'y',
					responsive: true,
					maintainAspectRatio: false,
					plugins: {legend: {display: false}},
					scales: {x: {beginAtZero: true, ticks: {stepSize: 1}}}
				}
			});
		}

		function renderGenreChart(genres) {
			if (genreChart) {genreChart.destroy();}

			const ctx = document.getElementById('genreCanvas').getContext('2d');
			const labels = (genres || []).map(g => g.genre);
			const data = (genres || []).map(g => g.count);
			const colours = [
			    '#2e7d32', '#388e3c', '#43a047', '#66bb6a',
			    '#81c784', '#1b5e20', '#a5d6a7', '#00695c', '#004d40', '#26a69a'
			];

			genreChart = new Chart(ctx, {
				type: 'pie',
				data: {
					labels: labels.length > 0 ? labels : ['No data'],
					datasets: [{
						data: data.length > 0 ? data : [1],
						backgroundColor: colours.slice(0, labels.length || 1)
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					plugins: {legend: {position: 'right'}}
				}
			});
		}

		function renderTrendChart(trend) {
			if (trendChart) {trendChart.destroy();}

			const ctx = document.getElementById('trendCanvas').getContext('2d');
			const labels = (trend || []).map(t => t.month);
			const data = (trend || []).map(t => t.count);

			trendChart = new Chart(ctx, {
				type: 'line',
				data: {
					labels: labels.length > 0 ? labels : ['No data'],
					datasets: [{
						label: 'Borrowings',
						data: data.length > 0 ? data : [0],
						borderColor: '#2e7d32',
						backgroundColor: 'rgba(46, 125, 50, 0.1)',
						borderWidth: 2,
						fill: true,
						tension: 0.3,
						pointBackgroundColor: '#2e7d32'
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					plugins: {legend: {display: false}},
					scales: {
						y: {beginAtZero: true, ticks: {stepSize: 1}}
					}
				}
			});
		}
	</script>
</body>

</html>
