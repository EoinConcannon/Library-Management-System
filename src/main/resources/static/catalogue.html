<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>LibraryMS - Catalogue</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
	<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
	<style>
		body {
			background: #f8f9fa;
			font-family: sans-serif;
		}

		.navbar {
			background: #fff;
			border-bottom: 1px solid #dee2e6;
		}

		.navbar-brand {
			font-weight: 700;
			font-size: 1.3rem;
		}

		.book-card {
			background: #fff;
			border: 1px solid #dee2e6;
			border-radius: 8px;
			padding: 1.2rem;
			height: 100%;
		}

		.book-card h6 {
			font-weight: 600;
			margin-bottom: 0.2rem;
		}

		.book-card .author {
			color: #6c757d;
			font-size: 0.85rem;
		}

		footer {
			background: #212529;
			color: #adb5bd;
			text-align: center;
			padding: 1.5rem;
			font-size: 0.85rem;
			margin-top: 3rem;
		}
	</style>
</head>

<body>

	<nav class="navbar navbar-expand-lg sticky-top">
		<div class="container">
			<a class="navbar-brand" href="index.html">LibraryMS</a>
			<div class="ms-auto d-flex gap-2 align-items-center">
				<a href="catalogue.html" class="btn btn-primary btn-sm">Catalogue</a>
				<a href="my-books.html" class="btn btn-outline-secondary btn-sm">My Books</a>
				<a href="book-management.html" id="bookMgmtBtn" class="btn btn-outline-secondary btn-sm d-none">Book
					Management</a>
				<a href="create-account.html" id="manageUsersBtn" class="btn btn-outline-secondary btn-sm d-none">Manage
					Users</a>
				<a href="/login.html" id="loginBtn" class="btn btn-outline-secondary btn-sm">Login</a>
				<span id="navUsername" class="text-muted small d-none"></span>
				<a href="#" onclick="logout()" id="logoutBtn" class="btn btn-outline-danger btn-sm d-none">Logout</a>
			</div>
		</div>
	</nav>

	<div class="container py-5">
		<h2 class="fw-bold mb-1">Book Catalogue</h2>
		<p class="text-muted mb-4">Browse all available books in the library.</p>

		<!-- Search & Filter -->
		<div class="row g-2 mb-4">
			<div class="col-md-6">
				<input type="text" id="searchInput" class="form-control" placeholder="Search by title or author..."
					oninput="filterBooks()" />
			</div>
			<div class="col-md-3">
				<select id="genreFilter" class="form-select" onchange="filterBooks()">
					<option value="">All Genres</option>
					<option>Fiction</option>
					<option>Non-Fiction</option>
					<option>Science Fiction</option>
					<option>Fantasy</option>
					<option>Mystery</option>
					<option>History</option>
					<option>Biography</option>
					<option>Romance</option>
					<option>Horror</option>
					<option>Other</option>
				</select>
			</div>
			<div class="col-md-3">
				<select id="availFilter" class="form-select" onchange="filterBooks()">
					<option value="">All Status</option>
					<option value="true">Available</option>
					<option value="false">Borrowed</option>
				</select>
			</div>
		</div>

		<div id="noResults" class="alert alert-info d-none">No books found.</div>
		<div class="row g-3" id="booksGrid"></div>

		<!-- Pagination -->
		<nav class="mt-4" id="paginationNav">
			<ul class="pagination justify-content-center" id="paginationControls"></ul>
		</nav>

		<div class="row g-3" id="booksGrid">
			<div class="col-12 text-center text-muted py-5">Loading books...</div>
		</div>
	</div>

	<footer>LibraryMS - MASE 2026</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function getToken() {return localStorage.getItem('jwt_token') || '';}
		function authHeaders() {
			return {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken()};
		}
		function logout() {
			localStorage.removeItem('jwt_token');
			localStorage.removeItem('user_name');
			localStorage.removeItem('user_role');
			window.location.href = '/login.html';
		}

		const PAGE_SIZE = 12;
		let allBooks = [];
		let filteredBooks = [];
		let currentPage = 1;
		let borrowedBookIds = new Set();

		document.addEventListener('DOMContentLoaded', () => {
			loadCurrentUser();
			loadBooks();
		});

		function loadCurrentUser() {
			const userName = localStorage.getItem('user_name');
			const userRole = localStorage.getItem('user_role');
			if (userName) {
				document.getElementById('loginBtn').classList.add('d-none');
				document.getElementById('navUsername').textContent = userName;
				document.getElementById('navUsername').classList.remove('d-none');
				document.getElementById('logoutBtn').classList.remove('d-none');
				if (userRole === 'LIBRARIAN') {
					document.getElementById('bookMgmtBtn').classList.remove('d-none');
					document.getElementById('manageUsersBtn').classList.remove('d-none');
				}
			}
		}

		async function loadBooks() {
			try {
				const res = await fetch('/api/books', {headers: authHeaders()});
				allBooks = await res.json();
			} catch (e) {
				allBooks = [
					{id: 1, title: 'The Great Gatsby', author: 'F. Scott Fitzgerald', genre: 'Fiction', isbn: '978-0-7432-7356-5', available: true},
					{id: 2, title: '1984', author: 'George Orwell', genre: 'Science Fiction', isbn: '978-0-452-28423-4', available: false},
					{id: 3, title: 'To Kill a Mockingbird', author: 'Harper Lee', genre: 'Fiction', isbn: '978-0-06-112008-4', available: true},
					{id: 4, title: 'Dune', author: 'Frank Herbert', genre: 'Science Fiction', isbn: '978-0-441-01369-7', available: true},
				];
			}

			// Load user's current borrowings to disable borrow/reserve on books they already have
			const token = getToken();
			if (token) {
				try {
					const borrowRes = await fetch('/api/borrowings/my', {headers: authHeaders()});
					const borrowings = await borrowRes.json();
					borrowedBookIds = new Set(borrowings.map(b => b.bookId));
				} catch (e) {
					borrowedBookIds = new Set();
				}
			}

			filteredBooks = [...allBooks];
			currentPage = 1;
			renderPage();
		}

		function filterBooks() {
			const search = document.getElementById('searchInput').value.toLowerCase();
			const genre = document.getElementById('genreFilter').value;
			const avail = document.getElementById('availFilter').value;

			filteredBooks = allBooks.filter(b => {
				const matchSearch = !search || b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search);
				const matchGenre = !genre || b.genre === genre;
				const matchAvail = avail === '' || String(b.available) === avail;
				return matchSearch && matchGenre && matchAvail;
			});

			currentPage = 1;
			renderPage();
		}

		function renderPage() {
			const grid = document.getElementById('booksGrid');
			const noResults = document.getElementById('noResults');
			const paginationNav = document.getElementById('paginationNav');

			if (filteredBooks.length === 0) {
				grid.innerHTML = '';
				noResults.classList.remove('d-none');
				paginationNav.classList.add('d-none');
				return;
			}

			noResults.classList.add('d-none');

			const totalPages = Math.ceil(filteredBooks.length / PAGE_SIZE);
			const start = (currentPage - 1) * PAGE_SIZE;
			const pageBooks = filteredBooks.slice(start, start + PAGE_SIZE);

			grid.innerHTML = pageBooks.map(b => {
				let buttonHtml;
				if (b.available) {
					buttonHtml = `<button class="btn btn-sm w-100 mt-1 btn-primary" onclick="borrowBook(${b.id})">Borrow</button>`;
				} else if (borrowedBookIds.has(b.id)) {
					buttonHtml = `<button class="btn btn-sm w-100 mt-1 btn-secondary" disabled>You are borrowing this</button>`;
				} else {
					buttonHtml = `<button class="btn btn-sm w-100 mt-1 btn-warning" onclick="reserveBook(${b.id})">Reserve</button>`;
				}

				return `
			        <div class="col-md-3 col-sm-6">
			            <div class="book-card">
			                <div class="d-flex justify-content-between align-items-start mb-2">
			                    <span class="badge bg-secondary">${esc(b.genre)}</span>
			                    <span class="badge ${b.available ? 'bg-success' : 'bg-danger'}">${b.available ? 'Available' : 'Borrowed'}</span>
			                </div>
			                <h6>${esc(b.title)}</h6>
			                <p class="author mb-2">${esc(b.author)}</p>
			                <p class="text-muted" style="font-size:0.75rem">ISBN: ${esc(b.isbn)}</p>
			                ${buttonHtml}
			            </div>
			        </div>
			    `;
			}).join('');

			renderPagination(totalPages);
		}

		function renderPagination(totalPages) {
			const nav = document.getElementById('paginationNav');
			const controls = document.getElementById('paginationControls');

			if (totalPages <= 1) {
				nav.classList.add('d-none');
				return;
			}

			nav.classList.remove('d-none');

			let html = `
		        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
		            <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">
		                <i class="bi bi-chevron-left"></i>
		            </a>
		        </li>`;

			for (let i = 1; i <= totalPages; i++) {
				// Show first, last, current and neighbours — ellipsis for others
				if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
					html += `
		                <li class="page-item ${i === currentPage ? 'active' : ''}">
		                    <a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>
		                </li>`;
				} else if (i === currentPage - 2 || i === currentPage + 2) {
					html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
				}
			}

			html += `
		        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
		            <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">
		                <i class="bi bi-chevron-right"></i>
		            </a>
		        </li>`;

			controls.innerHTML = html;
		}

		function goToPage(page) {
			const totalPages = Math.ceil(filteredBooks.length / PAGE_SIZE);
			if (page < 1 || page > totalPages) return;
			currentPage = page;
			renderPage();
			window.scrollTo({top: 0, behavior: 'smooth'});
		}

		async function borrowBook(id) {
			const userRole = localStorage.getItem('user_role');
			if (!userRole) {window.location.href = '/login.html'; return;}

			try {
				const res = await fetch(`/api/borrowings/${id}`, {
					method: 'POST',
					headers: authHeaders()
				});
				if (res.status === 201) {
					const book = allBooks.find(b => b.id === id);
					if (book) book.available = false;
					borrowedBookIds.add(id);
					filterBooks();
					showToast('Book borrowed successfully! View it in My Books.', 'success');
				} else if (res.status === 409) {
					showToast('This book is no longer available.', 'danger');
				} else {
					showToast('Something went wrong. Please try again.', 'danger');
				}
			} catch (e) {
				showToast('Could not connect to server.', 'danger');
			}
		}

		async function reserveBook(id) {
			const userRole = localStorage.getItem('user_role');
			if (!userRole) {window.location.href = '/login.html'; return;}

			try {
				const res = await fetch(`/api/reservations/${id}`, {
					method: 'POST',
					headers: authHeaders()
				});

				if (res.status === 201) {
					showToast('Book reserved successfully! You will be notified when it is available.', 'success');
				} else if (res.status === 409) {
					const data = await res.json();
					showToast(data.error || 'Could not reserve this book.', 'warning');
				} else {
					showToast('Something went wrong. Please try again.', 'danger');
				}
			} catch (e) {
				showToast('Could not connect to server.', 'danger');
			}
		}

		function showToast(message, type) {
			const container = document.getElementById('toastContainer');
			const id = 'toast-' + Date.now();
			container.innerHTML += `
		        <div id="${id}" class="toast align-items-center text-bg-${type} border-0" role="alert">
		            <div class="d-flex">
		                <div class="toast-body fw-semibold">${message}</div>
		                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
		            </div>
		        </div>`;
			new bootstrap.Toast(document.getElementById(id), {delay: 3500}).show();
		}

		function esc(str) {
			return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}
	</script>
	<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
</body>

</html>
