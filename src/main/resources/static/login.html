<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>LibraryMS - Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="/css/style.css" rel="stylesheet" />
</head>

<body class="login-page">
	<div class="login-card">
		<div class="login-brand">LibraryMS</div>
		<div class="login-subtitle">Library Management System</div>

		<div id="alertError" class="alert alert-danger d-none">
			Invalid email or password.
		</div>

		<div class="mb-3">
			<label class="form-label fw-semibold">Email Address</label>
			<input type="email" id="email" class="form-control" placeholder="Enter your email" />
		</div>
		<div class="mb-4">
			<label class="form-label fw-semibold">Password</label>
			<input type="password" id="password" class="form-control" placeholder="Enter your password"
				onkeydown="if(event.key==='Enter') login()" />
		</div>
		<button class="btn btn-primary w-100 py-2" onclick="login()">Sign In</button>
	</div>

	<script>
		async function login() {
			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;
			document.getElementById('alertError').classList.add('d-none');

			try {
				const res = await fetch('/api/auth/login', {
					method: 'POST',
					headers: {'Content-Type': 'application/json'},
					body: JSON.stringify({email, password})
				});

				if (res.ok) {
					const data = await res.json();
					localStorage.setItem('jwt_token', data.token);
					localStorage.setItem('user_name', data.name);
					localStorage.setItem('user_role', data.role);
					window.location.href = '/index.html';
				} else {
					document.getElementById('alertError').classList.remove('d-none');
				}
			} catch (e) {
				document.getElementById('alertError').classList.remove('d-none');
			}
		}
	</script>
</body>

</html>
