<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>LibraryMS — My Books</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
	<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
	<style>
		body {
			background: #f8f9fa;
			font-family: sans-serif;
		}

		.navbar {
			background: #fff;
			border-bottom: 1px solid #dee2e6;
		}

		.navbar-brand {
			font-weight: 700;
			font-size: 1.3rem;
		}

		.card {
			border: 1px solid #dee2e6;
			border-radius: 8px;
		}

		footer {
			background: #212529;
			color: #adb5bd;
			text-align: center;
			padding: 1.5rem;
			font-size: 0.85rem;
			margin-top: 3rem;
		}
	</style>
</head>

<body>

	<nav class="navbar navbar-expand-lg sticky-top">
		<div class="container">
			<a class="navbar-brand" href="index.html">LibraryMS</a>
			<div class="ms-auto d-flex gap-2 align-items-center">
				<a href="catalogue.html" class="btn btn-outline-secondary btn-sm">Catalogue</a>
				<a href="my-books.html" class="btn btn-primary btn-sm">My Books</a>
				<a href="book-management.html" id="bookMgmtBtn" class="btn btn-outline-secondary btn-sm d-none">Book
					Management</a>
				<a href="create-account.html" id="manageUsersBtn" class="btn btn-outline-secondary btn-sm d-none">Manage
					Users</a>
				<span id="navUsername" class="text-muted small d-none"></span>
				<a href="#" id="logoutBtn" class="btn btn-outline-danger btn-sm d-none" onclick="handleLogout()">Logout</a>
			</div>
		</div>
	</nav>

	<div class="container py-5">
		<h2 class="fw-bold mb-1"><i class="bi bi-journal-bookmark-fill me-2"></i>My Books</h2>
		<p class="text-muted mb-4">View your borrowed books and return them when done.</p>

		<div id="notLoggedIn" class="alert alert-warning d-none">
			<i class="bi bi-exclamation-triangle me-1"></i> Please <a href="login.html">log in</a> to view your borrowed books.
		</div>

		<div class="card p-4" id="loansCard">
			<table id="loansTable" class="table table-bordered table-hover" style="width:100%">
				<thead class="table-light">
					<tr>
						<th>Book Title</th>
						<th>Author</th>
						<th>Borrowed On</th>
						<th>Returned On</th>
						<th>Status</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>

	<footer>LibraryMS &mdash; MASE 2026</footer>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
	<script>
		let loans = [];
		let dataTable;

		function getToken() { return localStorage.getItem('jwt_token'); }
		function authHeaders() {
			var token = getToken();
			return token ? { 'Authorization': 'Bearer ' + token } : {};
		}
		function handleLogout() {
			localStorage.removeItem('jwt_token');
			localStorage.removeItem('user_name');
			localStorage.removeItem('user_role');
			window.location.href = 'index.html';
		}

		$(document).ready(function () {
			var token = getToken();
			if (!token) {
				$('#notLoggedIn').removeClass('d-none');
				$('#loansCard').addClass('d-none');
				return;
			}
			loadCurrentUser();
			initDataTable();
			loadLoans();
		});

		function initDataTable() {
			dataTable = $('#loansTable').DataTable({
				columns: [
					{ data: 'bookTitle' },
					{ data: 'bookAuthor' },
					{
						data: 'borrowedAt',
						render: function (data) { return data ? new Date(data).toLocaleDateString() : '-'; }
					},
					{
						data: 'returnedAt',
						render: function (data) { return data ? new Date(data).toLocaleDateString() : '-'; }
					},
					{
						data: 'returned',
						render: function (data) {
							return '<span class="badge ' + (data ? 'bg-success' : 'bg-warning text-dark') + '">' +
								(data ? 'Returned' : 'Borrowed') + '</span>';
						}
					},
					{
						data: null,
						orderable: false,
						render: function (data) {
							if (data.returned) return '<span class="text-muted small">—</span>';
							return '<button class="btn btn-outline-success btn-sm btn-return" data-id="' + data.id + '">' +
								'<i class="bi bi-arrow-return-left me-1"></i>Return</button>';
						}
					}
				],
				order: [[4, 'asc'], [2, 'desc']],
				language: {
					emptyTable: 'You haven\'t borrowed any books yet.',
					zeroRecords: 'No matching records found.'
				}
			});

			$('#loansTable').on('click', '.btn-return', function () {
				returnBook($(this).data('id'));
			});
		}

		function loadCurrentUser() {
			$.ajax({
				url: '/api/auth/me',
				headers: authHeaders(),
				success: function (user) {
					if (user && user.name) {
						$('#navUsername').text(user.name).removeClass('d-none');
						$('#logoutBtn').removeClass('d-none');
						if (user.role === 'LIBRARIAN') {
							$('#bookMgmtBtn').removeClass('d-none');
							$('#manageUsersBtn').removeClass('d-none');
						}
					}
				}
			});
		}

		function loadLoans() {
			$.ajax({
				url: '/api/loans/my',
				headers: authHeaders(),
				success: function (data) {
					loans = data;
					dataTable.clear();
					dataTable.rows.add(loans);
					dataTable.draw();
				},
				error: function () {
					loans = [];
					dataTable.clear().draw();
				}
			});
		}

		function returnBook(loanId) {
			if (!confirm('Return this book?')) return;
			$.ajax({
				url: '/api/loans/' + loanId + '/return',
				method: 'POST',
				headers: authHeaders(),
				success: function () {
					loadLoans();
				},
				error: function (xhr) {
					var msg = xhr.responseJSON ? xhr.responseJSON.error : 'Failed to return book.';
					alert(msg);
				}
			});
		}
	</script>
</body>

</html>
